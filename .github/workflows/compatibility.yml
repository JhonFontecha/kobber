name: Compatibility and security
on: [push, pull_request]
permissions:
  contents: read
jobs:
  compatibility:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: npm ci
      - run: npm run build
      - run: npm audit --audit-level=low
      - run: python -m pip install -r backend/requirements.txt pip-audit
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - name: Validate macOS launch scripts
        if: runner.os != 'Windows'
        run: bash -n deployment/macos/*.command
      - name: Validate deployment manager
        run: python deployment/common/manage.py --help
      - run: python -m pip_audit

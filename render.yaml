# Blueprint de Render — deploya sólo la tienda pública (backend chico + frontend estático).
# El Publicador (panel admin, Playwright, Claude) NO se deploya acá — sigue corriendo en la Mac
# de la empresa. Ver CLAUDE.md → "Deploy" para el detalle completo.
#
# Los nombres de servicio de abajo determinan la URL (https://<name>.onrender.com). Si al crear
# el Blueprint Render los renombra por estar ocupados, actualizar:
#   - el "destination" del rewrite del static site con la URL real del web service
#   - ALLOWED_ORIGINS en el web service con la URL real del static site

services:
  # Backend — sólo store.py, sin Playwright ni Claude
  - type: web
    name: kobber-store-api
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main_public:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: KOBBER_ENV
        value: production
      - key: PUBLIC_SITE_URL
        value: https://kobber-tienda.onrender.com
      - key: KOBBER_MARGEN_DEFAULT
        value: "30"
      - key: KOBBER_ENVIO_COSTO
        value: "15000"
      - key: KOBBER_ENVIO_GRATIS_DESDE
        value: "200000"
      # Opcionales. Si no se definen, el login del panel en este servidor queda cerrado.
      # La contraseña del panel vive en la Mac del Publicador; no hace falta repetirla acá.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://kobber-tienda.onrender.com,http://localhost:5173

  # Frontend — build estático de la tienda, sin el panel admin
  - type: web
    name: kobber-tienda
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_PUBLIC_ONLY
        value: "true"
    routes:
      - type: rewrite
        source: /api/*
        destination: https://kobber-store-api.onrender.com/api/*
      - type: rewrite
        source: /sitemap.xml
        destination: https://kobber-store-api.onrender.com/api/store/sitemap.xml
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /favicon.png
        name: Cache-Control
        value: public, max-age=604800
      - path: /apple-touch-icon.png
        name: Cache-Control
        value: public, max-age=604800
      - path: /og.jpg
        name: Cache-Control
        value: public, max-age=604800
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://www.truper.com https://images.unsplash.com; connect-src 'self'; font-src 'self'; upgrade-insecure-requests"
